[project]
name = "webapp-deploy-lambda"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.44.3",
]

[dependency-groups]
dev = [
    "coverage==7.17.3",
    "ruff>=0.8.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "B9"]

